<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat</title>
<style>
html,body{height:100%;margin:0}
body{display:grid;place-items:center;background:#111214;color:#dbdee1;font:16px system-ui,-apple-system,Segoe UI,sans-serif}
main{text-align:center;padding:32px}
button{border:0;border-radius:7px;padding:12px 20px;background:#5865f2;color:#fff;font-weight:700;cursor:pointer}
button:hover{background:#4752c4}
#status{margin-top:12px;color:#949ba4;font-size:13px;min-height:20px}
</style>
</head>
<body>
<main>
<button id="launch" type="button">Launch Chat</button>
<div id="status" aria-live="polite"></div>
</main>
<script>
const CHAT_URL="https://raw.githubusercontent.com/sashabolton0-ux/chat/main/chat.html";

document.getElementById("launch").addEventListener("click",()=>{
  const status=document.getElementById("status");
  status.textContent="Opening Chat...";

  // IMPORTANT:
  // This launcher is designed to be opened as a local file (file://).
  // It does NOT use fetch(), so browser file-origin restrictions cannot
  // prevent the launch.
  const freshUrl=CHAT_URL+"?v=7&fresh="+Date.now();
  const win=window.open(freshUrl,"_blank");

  if(!win){
    status.textContent="Please allow pop-ups for this launcher, then try again.";
    return;
  }

  status.textContent="";
});
</script>
</body>
</html>
