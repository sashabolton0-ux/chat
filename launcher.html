<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat</title>
<style>
html,body{height:100%;margin:0}
body{display:grid;place-items:center;background:#111214;color:#dbdee1;font:16px system-ui,-apple-system,Segoe UI,sans-serif}
main{text-align:center;padding:32px}
button{border:0;border-radius:7px;padding:12px 20px;background:#5865f2;color:#fff;font-weight:700;cursor:pointer}
button:hover{background:#4752c4}
p{color:#949ba4;font-size:13px}
</style>
</head>
<body>
<main>
<button id="launch" type="button">Launch Chat</button>
<p>Chat V7</p>
</main>
<script>
const CHAT_URL="https://cdn.jsdelivr.net/gh/sashabolton0-ux/chat@c9601badab587bc7bcb3e5c4ecc29ae890b4b302/chat.html";
document.getElementById("launch").addEventListener("click",()=>{
  window.location.href=CHAT_URL+"?v=7&fresh="+Date.now();
});
</script>
</body>
</html>
