<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>System</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#111318;color:#fff}
body{display:flex;overflow:hidden}
#main{width:100%;height:100%;display:flex;flex-direction:column;min-width:0}
#top{height:68px;border-bottom:1px solid #2b2f38;display:flex;align-items:center;padding:0 28px;font-weight:700;font-size:20px;flex-shrink:0}
#content{flex:1;overflow:auto;padding:34px 38px;color:#9da4b2}
#content .welcome{text-align:center;margin:0 auto 28px;max-width:900px}
#content h1{color:#fff;margin:0 0 8px;font-size:30px}
#apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:22px;max-width:1200px;margin:0 auto}
.app{border:1px solid #2b2f38;background:#181b22;color:#ddd;border-radius:16px;cursor:pointer;min-height:180px;padding:22px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transition:transform .12s ease,background .12s ease,border-color .12s ease}
.app:hover{background:#222731;border-color:#414856;transform:translateY(-2px);color:#fff}
.icon{font-size:46px;line-height:1;margin-bottom:16px}
.name{font-weight:700;font-size:17px}
.sub{font-size:13px;color:#8d94a3;margin-top:6px}
</style>
</head>
<body>
<main id="main">
  <header id="top">SYSTEM</header>
  <section id="content">
    <div class="welcome">
      <h1>Apps</h1>
      <div>Select an app to begin.</div>
    </div>
    <div id="apps"></div>
  </section>
</main>
<script>
const REPO="https://raw.githubusercontent.com/sashabolton0-ux/chat/main/";
const APPS_URL=REPO+"system/apps.json";

async function loadApps(){
  const r=await fetch(APPS_URL+"?t="+Date.now(),{cache:"no-store"});
  if(!r.ok) throw new Error("apps.json could not be loaded ("+r.status+").");
  const data=await r.json();
  const box=document.getElementById("apps");
  box.innerHTML="";
  for(const app of (data.apps||[])){
    const b=document.createElement("button");
    b.className="app";
    b.innerHTML=`<span class="icon">${app.icon||"◼"}</span><span><div class="name"></div><div class="sub"></div></span>`;
    b.querySelector(".name").textContent=app.name||"App";
    b.querySelector(".sub").textContent=app.description||"";
    b.onclick=()=>openApp(app);
    box.appendChild(b);
  }
}

async function openApp(app){
  if(!app.file) return;
  const url=REPO+app.file;
  const r=await fetch(url+"?t="+Date.now(),{cache:"no-store"});
  if(!r.ok) return alert("App could not be loaded ("+r.status+").");
  const html=await r.text();
  document.open(); document.write(html); document.close();
}

loadApps().catch(e=>{
  document.getElementById("apps").innerHTML="<div style='padding:8px;color:#ff8f8f'>"+e.message+"</div>";
});
</script>
</body>
</html>
