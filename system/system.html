<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#111318">
<title>LacesOS</title>
<link id="favicon" rel="icon" href="data:,">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
body{overflow:hidden;background:var(--bg);color:var(--text);transition:background .15s,color .15s}
button,input,select{font:inherit}
#main{width:100%;height:100%;display:flex;flex-direction:column;min-width:0}
#top{display:none}
#settingsBtn{position:fixed;left:18px;bottom:18px;z-index:20;border:1px solid var(--border);background:var(--card);color:var(--text);padding:10px 14px;border-radius:10px;cursor:pointer;box-shadow:0 8px 28px rgba(0,0,0,.28)}
#settingsBtn:hover{background:var(--hover)}
#content{flex:1;overflow:auto;padding:34px 38px;color:var(--muted)}
#content .welcome{text-align:center;margin:0 auto 28px;max-width:900px}
#content h1{color:var(--text);margin:0 0 8px;font-size:30px}
#apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:22px;max-width:1200px;margin:0 auto}
.app{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:16px;cursor:pointer;min-height:180px;padding:22px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transition:transform .12s ease,background .12s ease,border-color .12s ease}
.app:hover{background:var(--hover);border-color:var(--border2);transform:translateY(-2px)}
.icon{font-size:46px;line-height:1;margin-bottom:16px}
.name{font-weight:700;font-size:17px}
.sub{font-size:13px;color:var(--muted);margin-top:6px}
#posts{max-width:1200px;margin:0 auto 38px}
#postsTitle{color:var(--text);font-size:20px;font-weight:750;margin:0 0 14px}
.post{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px 20px;margin-bottom:12px}
.post h3{margin:0 0 6px;color:var(--text);font-size:17px}
.post .date{font-size:12px;color:var(--muted);margin-bottom:10px}
.post .body{color:var(--text);line-height:1.5;white-space:pre-wrap}
.emptyPosts{color:var(--muted);font-size:14px}
#modalBack{position:fixed;inset:0;background:rgba(0,0,0,.58);display:none;align-items:center;justify-content:center;padding:20px}
#modal{width:min(460px,100%);background:var(--modal);border:1px solid var(--border);border-radius:16px;padding:24px;box-shadow:0 20px 70px rgba(0,0,0,.35)}
#modal h2{margin:0 0 20px;color:var(--text)}
.field{margin:15px 0}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px;color:var(--muted)}
.field input,.field select{width:100%;padding:11px 12px;border-radius:9px;border:1px solid var(--border);background:var(--input);color:var(--text)}
.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}
.actions button{border:1px solid var(--border);border-radius:9px;padding:10px 14px;background:var(--card);color:var(--text);cursor:pointer}
.actions .save{background:var(--accent);border-color:var(--accent);color:#fff}
.note{font-size:12px;color:var(--muted);margin-top:6px}
#error{max-width:900px;margin:20px auto;padding:16px;border:1px solid #7a3d3d;background:#321b1b;color:#ffb5b5;border-radius:12px;display:none}
</style>
</head>
<body>
<main id="main">
  <button id="settingsBtn" type="button">⚙ Settings</button>

  <section id="content">
    <div class="welcome">
      <h1>Home</h1>
      <div>Posts and apps.</div>
    </div>
    <div id="posts">
      <div id="postsTitle">Posts</div>
      <div id="postsList"></div>
    </div>
    <div class="welcome" style="margin-bottom:18px">
      <h1 style="font-size:20px">Apps</h1>
    </div>
    <div id="apps"></div>
    <div id="error"></div>
  </section>
</main>

<div id="modalBack">
  <div id="modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <h2 id="settingsTitle">Settings</h2>
    <div class="field">
      <label for="tabName">Tab name</label>
      <input id="tabName" type="text" maxlength="80" placeholder="LacesOS">
    </div>
    <div class="field">
      <label for="iconUrl">Tab icon URL</label>
      <input id="iconUrl" type="url" placeholder="https://example.com/icon.png">
      <div class="note">Use a direct image URL.</div>
    </div>
    <div class="field">
      <label for="theme">Theme</label>
      <select id="theme">
        <option value="dark">Dark</option>
        <option value="light">Light</option>
        <option value="system">System default</option>
      </select>
    </div>
    <div class="actions">
      <button id="cancelSettings" type="button">Cancel</button>
      <button id="saveSettings" class="save" type="button">Save</button>
    </div>
  </div>
</div>

<script>
const REPO="https://raw.githubusercontent.com/sashabolton0-ux/chat/main/";
const APPS_URL=REPO+"system/apps.json";
const POSTS_URL=REPO+"system/posts.json";
const SETTINGS_KEY="system_settings_v1";

const themes={
  dark:{bg:"#111318",text:"#fff",muted:"#8d94a3",border:"#2b2f38",border2:"#414856",card:"#181b22",hover:"#222731",modal:"#181b22",input:"#111318",accent:"#5865f2"},
  light:{bg:"#f4f5f7",text:"#17191d",muted:"#68707d",border:"#d9dde4",border2:"#b9c0cb",card:"#fff",hover:"#e9ecf1",modal:"#fff",input:"#f4f5f7",accent:"#4f5bd5"}
};

function getSettings(){try{return JSON.parse(localStorage.getItem(SETTINGS_KEY)||"{}")}catch{return{}}}
function saveSettings(s){localStorage.setItem(SETTINGS_KEY,JSON.stringify(s))}
function resolvedTheme(mode){return mode==="system"?(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"):(mode==="light"?"light":"dark")}
function applySettings(){
  const s=getSettings(), t=themes[resolvedTheme(s.theme||"dark")];
  for(const [k,v] of Object.entries(t)) document.documentElement.style.setProperty("--"+k,v);
  document.title="LacesOS";
  document.querySelector('meta[name="theme-color"]').content=t.bg;
  document.getElementById("favicon").href=s.iconUrl?.trim()||"data:,";
}
applySettings();
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change",()=>{if((getSettings().theme||"dark")==="system")applySettings()});

const modalBack=document.getElementById("modalBack");
document.getElementById("settingsBtn").onclick=()=>{
  const s=getSettings();
  tabName.value=s.tabName||"LacesOS"; iconUrl.value=s.iconUrl||""; theme.value=s.theme||"dark";
  modalBack.style.display="flex"; tabName.focus();
};
const tabName=document.getElementById("tabName"), iconUrl=document.getElementById("iconUrl"), theme=document.getElementById("theme");
document.getElementById("cancelSettings").onclick=()=>modalBack.style.display="none";
modalBack.onclick=e=>{if(e.target===modalBack)modalBack.style.display="none"};
document.getElementById("saveSettings").onclick=()=>{
  saveSettings({tabName:tabName.value.trim()||"LacesOS",iconUrl:iconUrl.value.trim(),theme:theme.value});
  applySettings(); modalBack.style.display="none";
};

async function openApp(app){
  if(!app.file)return;
  try{
    const r=await fetch(REPO+app.file+"?t="+Date.now(),{cache:"no-store"});
    if(!r.ok)throw new Error("App could not be loaded ("+r.status+").");
    document.open();
    document.write(await r.text());
    document.close();
  }catch(e){alert(e.message)}
}

async function loadPosts(){
  const list=document.getElementById("postsList");
  try{
    const r=await fetch(POSTS_URL+"?t="+Date.now(),{cache:"no-store"});
    if(!r.ok)throw new Error("posts.json could not be loaded ("+r.status+").");
    const data=await r.json();
    const posts=Array.isArray(data.posts)?data.posts:[];
    if(!posts.length){list.innerHTML='<div class="emptyPosts">No posts yet.</div>';return}
    list.innerHTML="";
    for(const p of posts){
      const el=document.createElement("article");
      el.className="post";
      const title=document.createElement("h3"); title.textContent=p.title||"Post";
      const date=document.createElement("div"); date.className="date"; date.textContent=p.date||"";
      const body=document.createElement("div"); body.className="body"; body.textContent=p.body||"";
      el.append(title,date,body); list.appendChild(el);
    }
  }catch(e){list.innerHTML='<div class="emptyPosts">Posts are unavailable right now.</div>'}
}

async function loadApps(){
  const box=document.getElementById("apps"), err=document.getElementById("error");
  try{
    const r=await fetch(APPS_URL+"?t="+Date.now(),{cache:"no-store"});
    if(!r.ok)throw new Error("apps.json could not be loaded ("+r.status+").");
    const data=await r.json(); box.innerHTML="";
    for(const app of (data.apps||[])){
      const b=document.createElement("button"); b.className="app";
      b.innerHTML='<span class="icon"></span><span><div class="name"></div><div class="sub"></div></span>';
      b.querySelector(".icon").textContent=app.icon||"◼";
      b.querySelector(".name").textContent=app.name||"App";
      b.querySelector(".sub").textContent=app.description||"";
      b.onclick=()=>openApp(app); box.appendChild(b);
    }
  }catch(e){err.textContent=e.message;err.style.display="block"}
}
loadPosts();
loadApps();
</script>
</body>
</html>
