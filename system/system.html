<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#111318">
<title>System</title>
<link id="favicon" rel="icon" href="data:,">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
body{overflow:hidden;background:var(--bg);color:var(--text);transition:background .15s,color .15s}
#main{width:100%;height:100%;display:flex;flex-direction:column;min-width:0}
#top{height:68px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 28px;font-weight:700;font-size:20px;flex-shrink:0}
#settingsBtn{border:1px solid var(--border);background:var(--card);color:var(--text);padding:9px 13px;border-radius:9px;cursor:pointer;font:inherit;font-size:14px}
#settingsBtn:hover{background:var(--hover)}
#content{flex:1;overflow:auto;padding:34px 38px;color:var(--muted)}
#content .welcome{text-align:center;margin:0 auto 28px;max-width:900px}
#content h1{color:var(--text);margin:0 0 8px;font-size:30px}
#apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:22px;max-width:1200px;margin:0 auto}
.app{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:16px;cursor:pointer;min-height:180px;padding:22px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transition:transform .12s ease,background .12s ease,border-color .12s ease}
.app:hover{background:var(--hover);border-color:var(--border2);transform:translateY(-2px)}
.icon{font-size:46px;line-height:1;margin-bottom:16px}
.name{font-weight:700;font-size:17px}
.sub{font-size:13px;color:var(--muted);margin-top:6px}
#modalBack{position:fixed;inset:0;background:rgba(0,0,0,.58);display:none;align-items:center;justify-content:center;padding:20px}
#modal{width:min(460px,100%);background:var(--modal);border:1px solid var(--border);border-radius:16px;padding:24px;box-shadow:0 20px 70px rgba(0,0,0,.35)}
#modal h2{margin:0 0 20px;color:var(--text)}
.field{margin:15px 0}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px;color:var(--muted)}
.field input,.field select{width:100%;padding:11px 12px;border-radius:9px;border:1px solid var(--border);background:var(--input);color:var(--text);font:inherit}
.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}
.actions button{border:1px solid var(--border);border-radius:9px;padding:10px 14px;background:var(--card);color:var(--text);cursor:pointer;font:inherit}
.actions .save{background:var(--accent);border-color:var(--accent);color:#fff}
.note{font-size:12px;color:var(--muted);margin-top:6px}
</style>
</head>
<body>
<main id="main">
  <header id="top">
    <span id="systemName">SYSTEM</span>
    <button id="settingsBtn" type="button">⚙ Settings</button>
  </header>
  <section id="content">
    <div class="welcome">
      <h1>Apps</h1>
      <div>Select an app to begin.</div>
    </div>
    <div id="apps"></div>
  </section>
</main>

<div id="modalBack">
  <div id="modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <h2 id="settingsTitle">System Settings</h2>

    <div class="field">
      <label for="tabName">Tab name</label>
      <input id="tabName" type="text" maxlength="80" placeholder="System">
    </div>

    <div class="field">
      <label for="iconUrl">Tab icon URL</label>
      <input id="iconUrl" type="url" placeholder="https://example.com/icon.png">
      <div class="note">Use a direct image URL.</div>
    </div>

    <div class="field">
      <label for="theme">Theme</label>
      <select id="theme">
        <option value="dark">Dark</option>
        <option value="light">Light</option>
        <option value="system">System default</option>
      </select>
    </div>

    <div class="actions">
      <button id="cancelSettings" type="button">Cancel</button>
      <button id="saveSettings" class="save" type="button">Save</button>
    </div>
  </div>
</div>

<script>
const REPO="https://raw.githubusercontent.com/sashabolton0-ux/chat/main/";
const APPS_URL=REPO+"system/apps.json";
const SETTINGS_KEY="system_settings_v1";

const themes={
  dark:{
    bg:"#111318", text:"#fff", muted:"#8d94a3",
    border:"#2b2f38", border2:"#414856", card:"#181b22",
    hover:"#222731", modal:"#181b22", input:"#111318", accent:"#5865f2"
  },
  light:{
    bg:"#f4f5f7", text:"#17191d", muted:"#68707d",
    border:"#d9dde4", border2:"#b9c0cb", card:"#fff",
    hover:"#e9ecf1", modal:"#fff", input:"#f4f5f7", accent:"#4f5bd5"
  }
};

function getSettings(){
  try{return JSON.parse(localStorage.getItem(SETTINGS_KEY)||"{}")}catch{return{}}
}
function saveSettings(s){localStorage.setItem(SETTINGS_KEY,JSON.stringify(s))}
function resolvedTheme(mode){
  if(mode==="system") return matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
  return mode==="light"?"light":"dark";
}
function applySettings(){
  const s=getSettings();
  const mode=s.theme||"dark";
  const t=themes[resolvedTheme(mode)];
  for(const [k,v] of Object.entries(t)) document.documentElement.style.setProperty("--"+k,v);
  document.title=s.tabName?.trim()||"System";
  document.getElementById("systemName").textContent=s.tabName?.trim()||"SYSTEM";
  const meta=document.querySelector('meta[name="theme-color"]');
  meta.content=t.bg;
  const icon=document.getElementById("favicon");
  if(s.iconUrl?.trim()) icon.href=s.iconUrl.trim();
  else icon.href="data:,";
}
applySettings();
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change",()=>{
  if((getSettings().theme||"dark")==="system") applySettings();
});

const settingsBtn=document.getElementById("settingsBtn");
const modalBack=document.getElementById("modalBack");
const tabName=document.getElementById("tabName");
const iconUrl=document.getElementById("iconUrl");
const theme=document.getElementById("theme");

settingsBtn.onclick=()=>{
  const s=getSettings();
  tabName.value=s.tabName||"System";
  iconUrl.value=s.iconUrl||"";
  theme.value=s.theme||"dark";
  modalBack.style.display="flex";
  tabName.focus();
};
document.getElementById("cancelSettings").onclick=()=>modalBack.style.display="none";
modalBack.onclick=e=>{if(e.target===modalBack) modalBack.style.display="none"};
document.getElementById("saveSettings").onclick=()=>{
  saveSettings({
    tabName:tabName.value.trim()||"System",
    iconUrl:iconUrl.value.trim(),
    theme:theme.value
  });
  applySettings();
  modalBack.style.display="none";
};

async function loadApps(){
  const r=await fetch(APPS_URL+"?t="+Date.now(),{cache:"no-store"});
  if(!r.ok) throw new Error("apps.json could not be loaded ("+r.status+").");
  const data=await r.json();
  const box=document.getElementById("apps");
  box.innerHTML="";
  for(const app of (data.apps||[])){
    const b=document.createElement("button");
    b.className="app";
    b.innerHTML=`<span class="icon">${app.icon||"◼"}</span><span><div class="name"></div><div class="sub"></div></span>`;
    b.querySelector(".name").textContent=app.name||"App";
    b.querySelector(".sub").textContent=app.description||"";
    b.onclick=()=>openApp(app);
    box.appendChild(b);
  }
}

async function openApp(app){
  if(!app.file) return;
  const url=REPO+app.file;
  const r=await fetch(url+"?t="+Date.now(),{cache:"no-store"});
  if(!r.ok) return alert("App could not be loaded ("+r.status+").");
  const html=await r.text();
  document.open(); document.write(html); document.close();
}
loadApps().catch(e=>{
  document.getElementById("apps").innerHTML="<div style='padding:8px;color:#ff8f8f'>"+e.message+"</div>";
});
</script>
</body>
</html>
